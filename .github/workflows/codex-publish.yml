name: Publish Travel Log snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore reviewed site snapshot
        shell: bash
        run: |
          cat codex-publish-delta.tar.gz.* > /tmp/travel-log-delta.tar.gz
          echo "ded95a3508edb8626e32b3889b5eb36b8dd0d0142c5480daf3e07a9b77bf3bd8  /tmp/travel-log-delta.tar.gz" | sha256sum --check -
          tar -xzf /tmp/travel-log-delta.tar.gz
          rm -f codex-publish-delta.tar.gz.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --cached .github/workflows/codex-publish.yml
          test "$(git write-tree)" = "c3dcbb039e410eeb42b3e570bb94c2be7019b3c1"
          git add .github/workflows/codex-publish.yml
          git commit -m "Build Japan 2026 interactive travel map"
          git push origin HEAD:main

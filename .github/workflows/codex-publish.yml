name: Clean Travel Log publish metadata

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-publish.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated macOS sidecar files
        shell: bash
        run: |
          find . -type f -name '._*' -not -path './.git/*' -print -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove macOS metadata from published site"
          git push origin HEAD:main

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <meta
    name="description"
    content="An interactive travel log showing places and transport routes across Japan and Canada."
  >
  <title>Travel Log · Personal Atlas</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="./styles.css?v=20260809-5">
  <script defer src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
  <script
    defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script defer src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script defer src="./trip_routes/Japan_2026/rail-shapes.js?v=20260809-5"></script>
  <script defer src="./data.js?v=20260809-5"></script>
  <script defer src="./app.js?v=20260809-5"></script>
</head>
<body>
  <a class="skip-link" href="#map-stage">Skip to map</a>

  <div class="app-shell" id="app">
    <aside class="sidebar" aria-label="Travel log controls">
      <button class="brand brand-button" id="brand-home" type="button" aria-label="Return to the travel overview">
        <div class="brand__mark" aria-hidden="true">JL</div>
        <div>
          <p class="eyebrow">Personal atlas</p>
          <p class="brand__name">Travel Log</p>
        </div>
      </button>

      <nav class="trip-tabs" id="trip-tabs" aria-label="Choose a trip"></nav>

      <section class="trip-summary" aria-labelledby="trip-title">
        <div class="trip-summary__heading">
          <div>
            <p class="eyebrow" id="trip-eyebrow"></p>
            <h1 id="trip-title"></h1>
          </div>
          <span class="status-pill" id="trip-status"></span>
        </div>
        <p class="trip-summary__copy" id="trip-description"></p>
      </section>

      <section class="transport-legend" aria-labelledby="transport-heading">
        <div class="section-heading">
          <h2 id="transport-heading">Transport</h2>
          <span>Lines shown on the map</span>
        </div>
        <div class="legend-list" id="transport-legend"></div>
      </section>
    </aside>

    <main class="map-stage is-overview" id="map-stage" aria-label="Interactive travel map">
      <div class="map-vignette" aria-hidden="true"></div>
      <div
        id="globe-viz"
        class="globe-viz"
        role="img"
        aria-label="Auto-rotating globe showing visited airports and journeys"
      ></div>
      <div
        id="street-map"
        class="street-map"
        role="region"
        aria-label="Street map showing the selected trip's saved places and transport routes"
        hidden
      ></div>

      <div class="map-fallback" id="map-fallback" hidden>
        <p class="eyebrow">Map unavailable</p>
        <h2>The map could not load.</h2>
        <p>Try refreshing the page when the connection is available.</p>
      </div>

      <div class="map-heading" aria-hidden="true">
        <p class="eyebrow" id="map-eyebrow"></p>
        <p class="map-heading__title" id="map-title"></p>
      </div>

      <div class="map-focus" id="map-focus" role="group" aria-label="Map focus"></div>

      <article class="route-card" id="route-card" aria-live="polite">
        <div class="route-progress" aria-hidden="true">
          <span id="route-progress-fill"></span>
        </div>
        <div class="route-card__meta">
          <span class="mode-chip" id="route-mode"></span>
          <span id="route-step"></span>
        </div>
        <h2 id="route-title"></h2>
        <p id="route-detail"></p>
        <p class="route-card__note" id="route-note"></p>
        <div class="route-controls" id="route-controls">
          <button type="button" id="route-prev" aria-label="Previous route">←</button>
          <button class="route-play" type="button" id="route-play" aria-label="Play route animation">
            <span id="route-play-icon" aria-hidden="true">▶</span>
            <span id="route-play-label">Play route</span>
          </button>
          <button type="button" id="route-next" aria-label="Next route">→</button>
        </div>
      </article>
    </main>
  </div>

  <section class="gallery" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
    <header class="gallery__header">
      <div>
        <p class="eyebrow" id="gallery-kicker">Photo gallery</p>
        <h2 id="gallery-title"></h2>
      </div>
      <button class="round-button" id="gallery-close" type="button" aria-label="Close gallery">×</button>
    </header>
    <div class="gallery__grid" id="gallery-grid"></div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="round-button lightbox__close" id="lightbox-close" type="button" aria-label="Close photo">×</button>
    <img id="lightbox-image" src="" alt="">
  </div>

  <noscript>
    <div class="noscript-message">This interactive travel map needs JavaScript to display its routes.</div>
  </noscript>
</body>
</html>

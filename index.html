<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Travel Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080c10; color:#e8ede8; font-family:'DM Sans', sans-serif; overflow:hidden; height:100dvh; }
 
/* ── DESKTOP LAYOUT ── */
#app { display:flex; height:100dvh; }
 
#panel {
  width:240px; background:rgba(255,255,255,0.025); border-right:1px solid rgba(255,255,255,0.08);
  padding:24px 16px; display:flex; flex-direction:column; gap:8px; z-index:10; flex-shrink:0;
  order:-1; /* desktop: always renders before globe even though it's last in DOM */
}
#panel-title {
  font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
  color:rgba(255,255,255,0.3); margin-bottom:12px; cursor:pointer;
}
#panel-title:hover { color:rgba(255,255,255,0.6); }
 
.trip-btn {
  padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; cursor:pointer; transition:all 0.2s;
  color:rgba(255,255,255,0.7); font-size:13.5px; text-align:left; font-family:'DM Sans',sans-serif;
}
.trip-btn:hover { background:rgba(255,255,255,0.08); color:white; }
.trip-btn.active { background:rgba(80,200,140,0.12); border-color:#50c88c; color:#50c88c; }
 
#globeViz { flex:1; position:relative; order:0; }
 
/* ── BILLBOARD ── */
#billboard {
  position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
  background:rgba(6,10,14,0.94); border:1px solid rgba(80,200,140,0.25); border-radius:14px;
  padding:18px 20px; min-width:280px; max-width:380px; display:none; z-index:100;
  backdrop-filter:blur(16px); cursor:pointer;
  order:1; /* desktop: sits in absolute flow so order doesn't matter, but needed for mobile */
}
#bb-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
#bb-city { color:#50c88c; font-weight:500; font-size:13px; }
#bb-header-right { display:flex; align-items:center; gap:10px; }
#bb-count { font-size:12px; color:rgba(255,255,255,0.4); }
#bb-close {
  width:28px; height:28px; border-radius:50%;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.5); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.15s; flex-shrink:0;
}
#bb-close:hover { background:rgba(255,255,255,0.18); color:white; }
#bb-stack {
  --bb-thumb-size:92px; --bb-thumb-offset:22px;
  position:relative; height:var(--bb-thumb-size); margin:12px auto; pointer-events:none;
}
.bb-img {
  width:var(--bb-thumb-size); height:var(--bb-thumb-size); object-fit:cover; border-radius:10px;
  position:absolute; border:2px solid #111; background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
  box-shadow:0 12px 24px rgba(0,0,0,0.28);
}
#bb-controls { display:flex; justify-content:center; gap:30px; margin-top:8px; }
.bb-arrow {
  background:none; border:none; color:#50c88c; font-size:28px; cursor:pointer;
  padding:0 8px;
  /* bigger tap target on mobile */
  min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
}
 
/* ── GALLERY ── */
#gallery {
  position:fixed; inset:0; background:#08090c;
  z-index:200; display:none; flex-direction:column;
}
#gallery-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0;
}
#gallery-title-block { display:flex; flex-direction:column; gap:3px; }
#gallery-location { font-size:9px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#50c88c; }
#gallery-name { font-size:18px; color:rgba(255,255,255,0.9); }
#gallery-close {
  width:40px; height:40px; background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); font-size:16px;
  border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.15s; flex-shrink:0;
}
#gallery-close:hover { background:rgba(255,255,255,0.14); color:white; }
 
/* ── Instagram 3-col grid ── */
#gallery-grid {
  flex:1; overflow-y:auto;
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:3px; padding:3px; align-content:start;
}
#gallery-grid::-webkit-scrollbar { width:4px; }
#gallery-grid::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
.gal-img {
  width:100%; aspect-ratio:1/1; object-fit:cover;
  display:block; cursor:zoom-in; transition:opacity 0.15s;
  background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
}
.gal-img:hover { opacity:0.78; }
 
/* ── LIGHTBOX ── */
#lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,0.97);
  z-index:300; display:none; align-items:center; justify-content:center;
}
#lb-img { max-width:92vw; max-height:92vh; border-radius:4px; object-fit:contain; display:block; }
#lb-close {
  position:fixed; top:20px; right:20px;
  width:44px; height:44px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  color:white; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.15s; z-index:301;
}
#lb-close:hover { background:rgba(255,255,255,0.22); }
 
/* ── MOBILE (<=768px — phones and small tablets) ── */
@media (max-width:768px) {
 
  /* Three rows top-to-bottom: globe | billboard | trip strip */
  #app { flex-direction:column; }
 
  /* Globe: takes remaining space after billboard + strip */
  #globeViz { flex:1; min-height:0; }
 
  /* Billboard: static row — no longer floats over the globe */
  #billboard {
    position:static;           /* pull out of absolute flow */
    transform:none;
    left:auto; right:auto; bottom:auto;
    display:none;              /* JS still toggles this */
    width:100%;
    min-width:0; max-width:none;
    border-radius:0;
    border-left:none; border-right:none; border-bottom:none;
    border-top:1px solid rgba(80,200,140,0.2);
    padding:14px 16px;
    /* no backdrop-filter needed — it has its own solid background now */
    backdrop-filter:none;
    flex-shrink:0;
  }
 
  /* When JS sets display:block, make it behave as a block row */
  /* (JS uses style.display = 'block', which is fine for a block-level div) */
 
  /* Smaller photo stack */
  #bb-stack { --bb-thumb-size:72px; --bb-thumb-offset:18px; }
 
  /* Trip strip: horizontal scrollable chips pinned at very bottom */
  #panel {
    width:100%; height:auto;
    flex-direction:row; align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); gap:8px;
    border-right:none; border-top:1px solid rgba(255,255,255,0.08);
    overflow-x:auto; overflow-y:hidden; flex-shrink:0;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #panel::-webkit-scrollbar { display:none; }
 
  /* "TRIPS" label */
  #panel-title { font-size:9px; margin-bottom:0; flex-shrink:0; white-space:nowrap; }
 
  /* Pill chips */
  .trip-btn {
    padding:9px 18px; border-radius:20px;
    font-size:13px; white-space:nowrap; flex-shrink:0; text-align:center;
  }
 
  /* Gallery */
  #gallery-header { padding:14px 16px; }
  #gallery-name { font-size:15px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="globeViz"></div>
  <div id="billboard">
  <div id="bb-header">
    <div id="bb-city"></div>
    <div id="bb-header-right">
      <div id="bb-count"></div>
      <button id="bb-close" title="Close & resume spin">✕</button>
    </div>
  </div>
  <div id="bb-stack"></div>
  <div id="bb-controls">
    <button class="bb-arrow" id="bb-prev">‹</button>
    <button class="bb-arrow" id="bb-next">›</button>
  </div>
  </div><!-- /#billboard -->
  <div id="panel">
    <div id="panel-title">TRIPS</div>
  </div>
</div><!-- /#app -->
 
<div id="gallery">
  <div id="gallery-header">
    <div id="gallery-title-block">
      <div id="gallery-location">Photo Gallery</div>
      <div id="gallery-name"></div>
    </div>
    <button id="gallery-close">✕</button>
  </div>
  <div id="gallery-grid"></div>
</div>
 
<div id="lightbox">
  <button id="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>

function previewSrc(src) {
  return src
    .replace('./trip_images/', './trip_images/_previews/')
    .replace(/\.(jpe?g|png)$/i, '.jpg');
}

function preloadPreviews(point, limit = 3) {
  point.images.slice(0, limit).forEach(src => {
    const img = new Image();
    img.src = previewSrc(src);
  });
}

function getBillboardMetrics() {
  const stack = document.getElementById('bb-stack');
  const styles = getComputedStyle(stack);
  return {
    size: parseFloat(styles.getPropertyValue('--bb-thumb-size')) || 92,
    offset: parseFloat(styles.getPropertyValue('--bb-thumb-offset')) || 22,
  };
}

function buildCountryFeatures() {
  const features = [];
  Object.keys(GEO).forEach(country => {
    GEO[country].forEach(ring => {
      features.push({
        type:"Feature",
        geometry:{ type:"Polygon", coordinates:[ring.map(p => [p[0], p[1]])] },
        properties:{ country }
      });
    });
  });
  return features;
}

function getHubByName(name) {
  const allHubs = [
    ...VISITED_AIRPORTS,
    ...EXTRA_VISITED_CITIES,
    ...TRIPS.flatMap(trip => trip.points),
  ];
  return allHubs.find(hub => hub.name === name);
}

function getRouteData() {
  return ROUTES
    .map(route => ({ ...route, start:getHubByName(route.from), end:getHubByName(route.to) }))
    .filter(route => route.start && route.end);
}

function getAirportLabels() {
  return VISITED_AIRPORTS.map(airport => ({ ...airport, type:'airport-label' }));
}
 
// ── GLOBE INIT ────────────────────────────────────────────────────────────────
globe = new Globe(document.getElementById('globeViz'))
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
  .backgroundColor('rgba(0,0,0,0)')
  .polygonsData([])
  .polygonAltitude(0.01)
  .polygonCapColor(d => {
    const shades = {
      Canada:'rgba(225,230,226,0.16)',
      USA:'rgba(225,230,226,0.11)',
      Japan:'rgba(225,230,226,0.14)',
    };
    return shades[d.properties.country] || 'rgba(225,230,226,0.12)';
  })
  .polygonSideColor(() => 'rgba(225,230,226,0.04)')
  .polygonStrokeColor(() => 'rgba(238,246,242,0.42)')
  .pointsData([])
  .pointAltitude(d => d.type === 'airport' ? 0.045 : 0.03)
  .pointRadius(d => d.type === 'airport' ? 0.18 : d.type === 'trip' ? 0.34 : 0.24)
  .pointColor(d => d.color)
  .pointLabel(d => `<div style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:#fff;padding:4px 10px;background:rgba(6,10,14,0.88);border:1px solid rgba(255,255,255,0.12);border-radius:6px;white-space:nowrap;">${d.name}</div>`)
  .labelsData([])
  .labelLat(d => d.lat)
  .labelLng(d => d.lng)
  .labelText(d => d.name)
  .labelSize(() => 0.54)
  .labelDotRadius(() => 0)
  .labelColor(() => 'rgba(232,237,232,0.66)')
  .labelAltitude(() => 0.035)
  .arcsData([])
  .arcStartLat(d => d.start.lat)
  .arcStartLng(d => d.start.lng)
  .arcEndLat(d => d.end.lat)
  .arcEndLng(d => d.end.lng)
  .arcColor(() => ['rgba(80,200,140,0.28)', 'rgba(80,200,140,0.78)'])
  .arcAltitude(() => 0.28)
  .arcStroke(() => 0.65)
  .arcDashLength(() => 0.32)
  .arcDashGap(() => 1.4)
  .arcDashAnimateTime(() => 4200)
  .ringsData([])
  .ringLat(d => d.lat)
  .ringLng(d => d.lng)
  .ringColor(d => d.type === 'airport' ? 'rgba(51,136,255,0.24)' : 'rgba(80,200,140,0.32)')
  .ringMaxRadius(() => 2.2)
  .ringPropagationSpeed(() => 0.55)
  .ringRepeatPeriod(() => 2400)
  .onPointClick(d => {
    if (currentTrip) {
      const idx = currentTrip.points.findIndex(p => p.name === d.name);
      if (idx !== -1) { currentStopIndex = idx; showBillboard(); }
    }
  });
 
// ── HEX POLYGONS ──────────────────────────────────────────────────────────────
function generateCountryPolygons() {
  globe.polygonsData(buildCountryFeatures());
}
 
// ── POINTS ────────────────────────────────────────────────────────────────────
function refreshAllPoints(activeTrip = null) {
  const points = [];
 
  if (activeTrip) {
    // Only show this trip's stops, all in red
    activeTrip.points.forEach(city => {
      points.push({ lat:city.lat, lng:city.lng, name:city.name, color:'#ff3366', type:'trip' });
    });
  } else {
    // Idle: show every trip city in green
    const cityMap = new Map();
    TRIPS.forEach(t => t.points.forEach(c => cityMap.set(c.name, c)));
    cityMap.forEach(city => {
      points.push({ lat:city.lat, lng:city.lng, name:city.name, color:'#50c88c', type:'trip' });
    });
    // Extra cities and airports
    EXTRA_VISITED_CITIES.forEach(c => points.push({ lat:c.lat, lng:c.lng, name:c.name, color:'#50c88c', type:'extra' }));
    VISITED_AIRPORTS.forEach(a => points.push({ lat:a.lat, lng:a.lng, name:a.name, color:'#3388ff', type:'airport' }));
  }
 
  globe.pointsData(points);
  globe.labelsData(activeTrip ? [] : getAirportLabels());
  globe.arcsData(activeTrip ? [] : getRouteData());
  globe.ringsData(points.filter(point => point.type === 'airport'));
}
 
// ── FREE SPIN ─────────────────────────────────────────────────────────────────
function enableFreeSpin() {
  currentTrip = null;
  currentStopIndex = 0;
  document.querySelectorAll('.trip-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('billboard').style.display = 'none';
  refreshAllPoints(null);
  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.32;
}
 
// ── BILLBOARD ─────────────────────────────────────────────────────────────────
function showBillboard() {
  if (!currentTrip) return;
  const p = currentTrip.points[currentStopIndex];
  document.getElementById('bb-city').textContent = p.name;
  document.getElementById('bb-count').textContent = `${currentStopIndex+1}/${currentTrip.points.length} · ${p.images.length} photos`;
 
  const stack = document.getElementById('bb-stack');
  stack.innerHTML = '';
  const n = Math.min(5, p.images.length);
  const metrics = getBillboardMetrics();
  stack.style.width = n ? (metrics.size + (n-1)*metrics.offset) + 'px' : '0px';
  preloadPreviews(p);
  for (let i = 0; i < n; i++) {
    const img = document.createElement('img');
    img.className = 'bb-img';
    img.src = previewSrc(p.images[i]);
    img.alt = `${p.name} preview ${i + 1}`;
    img.decoding = 'async';
    img.loading = i === 0 ? 'eager' : 'lazy';
    img.style.left  = (i * metrics.offset) + 'px';
    img.style.zIndex = n - i;
    img.style.transform = `rotate(${(i-(n-1)/2)*3.5}deg)`;
    stack.appendChild(img);
  }
  document.getElementById('billboard').style.display = 'block';
}
 
// ── GALLERY ───────────────────────────────────────────────────────────────────
function openGallery(point) {
  // header
  document.getElementById('gallery-location').textContent = currentTrip ? currentTrip.name : 'Photo Gallery';
  document.getElementById('gallery-name').textContent = point.name;
 
  // build grid
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';
  point.images.forEach(src => {
    const img = document.createElement('img');
    img.className = 'gal-img';
    img.src = previewSrc(src);
    img.alt = `${point.name} photo`;
    img.decoding = 'async';
    img.loading = 'lazy';
    img.onclick = e => { e.stopPropagation(); openLightbox(src); };
    grid.appendChild(img);
  });
 
  document.getElementById('gallery').style.display = 'flex';
}
 
function closeGallery() {
  document.getElementById('gallery').style.display = 'none';
}
 
// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
 
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
 
// ── EVENT LISTENERS ───────────────────────────────────────────────────────────
document.getElementById('panel-title').onclick = enableFreeSpin;
 
document.getElementById('bb-close').onclick = e => {
  e.stopPropagation();
  enableFreeSpin();
};
 
document.getElementById('billboard').onclick = () => {
  if (currentTrip) openGallery(currentTrip.points[currentStopIndex]);
};
 
document.getElementById('bb-prev').onclick = e => {
  e.stopPropagation();
  if (!currentTrip) return;
  currentStopIndex = (currentStopIndex - 1 + currentTrip.points.length) % currentTrip.points.length;
  showBillboard();
};
document.getElementById('bb-next').onclick = e => {
  e.stopPropagation();
  if (!currentTrip) return;
  currentStopIndex = (currentStopIndex + 1) % currentTrip.points.length;
  showBillboard();
};
 
document.getElementById('gallery-close').onclick = e => {
  e.stopPropagation();
  closeGallery();
};
 
document.getElementById('lb-close').onclick = e => {
  e.stopPropagation();
  closeLightbox();
};
 
document.getElementById('lightbox').onclick = e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
};
 
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('lightbox').style.display === 'flex') { closeLightbox(); return; }
  if (document.getElementById('gallery').style.display  === 'flex') { closeGallery();  return; }
  if (document.getElementById('billboard').style.display === 'block') { enableFreeSpin(); }
});
 
// ── TRIP BUTTONS ──────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
TRIPS.forEach(trip => {
  const btn = document.createElement('button');
  btn.className = 'trip-btn';
  btn.textContent = trip.name;
  btn.onclick = () => {
    document.querySelectorAll('.trip-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTrip = trip;
    currentStopIndex = 0;
    refreshAllPoints(trip);
    globe.controls().autoRotate = false;
    globe.pointOfView({ lat:trip.points[0].lat, lng:trip.points[0].lng, altitude:1.75 }, 1400);
    preloadPreviews(trip.points[0], 5);
    showBillboard();
  };
  panel.appendChild(btn);
});
 
// ── INIT ──────────────────────────────────────────────────────────────────────
generateCountryPolygons();
refreshAllPoints(null);
globe.pointOfView({ lat:37, lng:-60, altitude:1 }, 0);
globe.onGlobeReady(() => {
  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.32;
});
 
// Resize globe canvas when window or orientation changes
function resizeGlobe() {
  const el = document.getElementById('globeViz');
  globe.width(el.clientWidth);
  globe.height(el.clientHeight);
}
window.addEventListener('resize', resizeGlobe);
// Also fire after a short delay to catch mobile browser chrome collapsing
window.addEventListener('resize', () => setTimeout(resizeGlobe, 300));
